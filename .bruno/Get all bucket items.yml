info:
  name: Get all bucket items
  type: http
  seq: 6

http:
  method: GET
  url: http://localhost:8001/:bucket?prefix=test&max-keys=2&continuation-token=test2.txt
  params:
    - name: prefix
      value: test
      type: query
    - name: max-keys
      value: "2"
      type: query
    - name: continuation-token
      value: test2.txt
      type: query
    - name: bucket
      value: my-bucket
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
